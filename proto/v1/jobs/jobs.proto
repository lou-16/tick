syntax = "proto3";

package proto.v1.jobs;

import "utils/void.proto";
import "status/status.proto";

message id {
  string id = 1;
};

message JobRequest {
  id id = 1;
  string command = 2;
  repeated float data = 3;
  optional string message = 4;
};

service JobService {
  rpc addJob(JobRequest) returns (proto.v1.utils.void.void);
  rpc getJobFromId(id) returns (JobRequest);
  rpc getStatus(id) returns (proto.v1.status.statusMessage);
};
 